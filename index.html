<style>
/* Plano de laboratorio: papel cuadriculado azul frío, tinta oscura, un acento azul eléctrico.
   Mallas/nodos usan teal, magenta y violeta; la corriente animada es ámbar. */
:root {
  --bg: #edf1f7;
  --surface: #ffffff;
  --surface2: #f5f7fb;
  --ink: #0f1b2e;
  --muted: #56667d;
  --line: #d6deea;
  --accent: #1f4fd1;
  --accent-ink: #ffffff;
  --wire: #1b2a42;
  --flow: #e8a100;
  --c1: #0d9488;
  --c2: #d1307c;
  --c3: #6a45dc;
  --sup: #e2620b;
  --ok: #157a3c;
  --bad: #b42318;
  --grid: rgba(31, 79, 209, 0.07);
  --shadow: 0 1px 2px rgba(15, 27, 46, 0.06), 0 6px 24px rgba(15, 27, 46, 0.06);
  --f-display: 'Bricolage Grotesque', 'IBM Plex Sans', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1120; --surface: #111b2e; --surface2: #0d1627; --ink: #e6edf8; --muted: #93a4bc; --line: #24334d;
    --accent: #84a9ff; --accent-ink: #0a1120; --wire: #cbd7ea; --flow: #ffc94a;
    --c1: #2dd4bf; --c2: #f472b6; --c3: #a78bfa; --sup: #fb923c; --ok: #4ade80; --bad: #f87171;
    --grid: rgba(132, 169, 255, 0.05); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1120; --surface: #111b2e; --surface2: #0d1627; --ink: #e6edf8; --muted: #93a4bc; --line: #24334d;
  --accent: #84a9ff; --accent-ink: #0a1120; --wire: #cbd7ea; --flow: #ffc94a;
  --c1: #2dd4bf; --c2: #f472b6; --c3: #a78bfa; --sup: #fb923c; --ok: #4ade80; --bad: #f87171;
  --grid: rgba(132, 169, 255, 0.05); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background-color: var(--bg); color: var(--ink); font-family: var(--f-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; -webkit-font-smoothing: antialiased;
}
#root { min-height: 100%; }
h1, h2 { text-wrap: balance; }
.font-display { font-family: var(--f-display); font-weight: 700; letter-spacing: -0.01em; }
.kicker { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.mx { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.mx sub, .tip sub, .step-t sub { font-size: 0.72em; vertical-align: -0.28em; line-height: 0; }
.mx-inline { font-size: 0.92em; padding: 0 0.1em; color: var(--ink); white-space: nowrap; }
button, [role="button"] { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* Pestañas */
.tabs { display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: 1 0 auto; scroll-snap-align: start; min-height: 46px; padding: 0 16px; border-radius: 10px; font-weight: 600; font-size: 0.95rem; color: var(--muted); white-space: nowrap; transition: background .15s, color .15s; }
.tabs button:hover { color: var(--ink); background: var(--surface2); }
.tabs button.on { background: var(--accent); color: var(--accent-ink); }

.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 3px; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; }
.seg button { min-height: 42px; padding: 0 14px; border-radius: 9px; font-size: 0.9rem; font-weight: 500; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1.5px var(--accent) inset; font-weight: 600; }
.seg-sm button { min-height: 36px; padding: 0 11px; font-size: 0.82rem; }

/* Paneles */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
.panel-toggle { min-height: 44px; }
.chev { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--line); color: var(--muted); font-size: 1.1rem; transition: transform .2s; flex: none; }
.chev.open { transform: rotate(90deg); }
.chip { min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface2); font-size: 0.82rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
.chip:hover { color: var(--ink); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.circuit-card.stuck { position: sticky; top: 0; z-index: 30; border-top-left-radius: 0; border-top-right-radius: 0; }
.circuit-card.stuck .circuit-svg { max-height: 36vh; }
.svg-wrap { touch-action: manipulation; }
@media (min-width: 1024px) {
  .left-col { scrollbar-width: thin; }
}

/* Términos del glosario */
.term { color: inherit; text-decoration: underline dotted var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; cursor: help; border-radius: 4px; }
.term:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.tip-card { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 14px; padding: 14px 16px 14px; box-shadow: 0 18px 50px rgba(10, 20, 40, 0.22); animation: tipin .14s ease-out; }
.tip-x { width: 30px; height: 30px; border-radius: 8px; color: var(--muted); font-size: 1.2rem; line-height: 1; flex: none; }
.tip-x:hover { background: var(--surface2); color: var(--ink); }
.tip-block { border-left: 3px solid var(--c1); padding-left: 10px; }
.tip-block-s { border-left-color: var(--c3); }
.tip-label { font-family: var(--f-mono); font-size: 0.66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); margin-bottom: 2px; }
@keyframes tipin { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* SVG */
.svg-label { font-family: var(--f-mono); font-size: 14px; fill: var(--ink); }
.svg-name { font-weight: 600; font-size: 15px; }
.svg-val { fill: var(--muted); font-size: 13.5px; }
.svg-curr { font-family: var(--f-mono); font-size: 12.5px; fill: var(--flow); font-weight: 600; }
.svg-sign { font-family: var(--f-mono); font-size: 17px; font-weight: 600; fill: var(--wire); }
.svg-mesh-label { font-family: var(--f-mono); font-size: 13px; font-weight: 600; }
.svg-super { font-family: var(--f-body); font-size: 13px; font-weight: 600; letter-spacing: .02em; }
.svg-badge { font-family: var(--f-mono); font-size: 12.5px; font-weight: 600; }
.svg-term { font-family: var(--f-mono); font-size: 15px; font-weight: 600; fill: var(--accent); }
.chart-t { font-family: var(--f-mono); font-size: 10.5px; fill: var(--muted); }
@media (max-width: 640px) {
  .brand { font-size: .92rem; } .hud-pill { font-size: .78rem; padding: 4px 7px; }
  .svg-name { font-size: 18px; } .svg-val { font-size: 16px; } .svg-label { font-size: 16px; }
  .svg-mesh-label { font-size: 15px; } .svg-badge { font-size: 14px; } .svg-term { font-size: 17px; } .svg-super { font-size: 14px; } .svg-curr { font-size: 14px; }
}
.glow-wire { fill: none; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; opacity: 0.75; }
.region-on { transition: fill-opacity .2s; }
.comp.clickable { cursor: pointer; }
.comp.clickable:hover path, .comp.clickable:hover circle { stroke: var(--accent); }
.mesh-arrow { opacity: .75; transition: opacity .2s; }
.mesh-arrow.strong { opacity: 1; }
.mesh-arrow.strong path { animation: spin-dash 1.2s linear infinite; stroke-dasharray: 6 4; }
.flow { fill: none; stroke: var(--flow); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 0.1 16; animation-name: flowmove; animation-timing-function: linear; animation-iteration-count: infinite; filter: drop-shadow(0 0 2px var(--flow)); }
@keyframes flowmove { to { stroke-dashoffset: -16.1; } }
@keyframes spin-dash { to { stroke-dashoffset: -20; } }
.legend-flow { display: inline-flex; gap: 4px; }
.legend-flow i { width: 6px; height: 6px; border-radius: 50%; background: var(--flow); animation: blink 1.2s infinite; }
.legend-flow i:nth-child(2) { animation-delay: .2s; } .legend-flow i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: .25; } }
.legend-chip { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px solid color-mix(in srgb, var(--c) 45%, transparent); font-size: 0.82rem; font-weight: 600; color: var(--ink); background: var(--surface); }
.legend-chip i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.legend-chip.on { background: color-mix(in srgb, var(--c) 16%, var(--surface)); border-color: var(--c); }

/* Controles */
.ctl { padding: 10px 12px 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface2); transition: box-shadow .3s, border-color .3s; }
.ctl.flash { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.stepper { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 1.2rem; font-weight: 600; color: var(--ink); }
.stepper:active { background: var(--line); }
.num { width: 70px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); text-align: right; padding: 0 8px; font-family: var(--f-mono); font-size: 0.95rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.unit { font-family: var(--f-mono); font-size: 0.85rem; color: var(--muted); width: 14px; }
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 40px; background: transparent; cursor: pointer; margin: 2px 0 0; }
.range::-webkit-slider-runnable-track { height: 6px; border-radius: 6px; background: linear-gradient(90deg, var(--accent) var(--pct), var(--line) var(--pct)); }
.range::-moz-range-track { height: 6px; border-radius: 6px; background: var(--line); }
.range::-moz-range-progress { height: 6px; border-radius: 6px; background: var(--accent); }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,.18); }
.range::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); }

/* Pasos */
.steps { display: flex; flex-direction: column; gap: 8px; list-style: none; padding: 0; margin: 0; }
.step { display: flex; gap: 12px; padding: 11px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s; }
.step:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.step.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.step-n { flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; font-size: .85rem; background: var(--surface2); border: 1px solid var(--line); color: var(--ink); }
.step.on .step-n, .step.view-on .step-n { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.step-t { font-weight: 600; font-size: 0.95rem; color: var(--ink); line-height: 1.3; }
.step-d { font-size: 0.89rem; color: var(--muted); line-height: 1.55; margin-top: 3px; max-width: 68ch; }
.insight { font-size: 0.88rem; line-height: 1.55; color: var(--ink); border-left: 3px solid var(--sup); padding: 8px 12px; background: color-mix(in srgb, var(--sup) 7%, var(--surface)); border-radius: 0 10px 10px 0; }

/* Ecuaciones */
.eq { padding: 11px 13px 12px; border-radius: 14px; border: 1px solid var(--line); border-left: 4px solid var(--hl); background: var(--surface); cursor: pointer; transition: background .15s, box-shadow .15s; }
.eq:hover, .eq.on { background: color-mix(in srgb, var(--hl) 8%, var(--surface)); }
.eq.on { box-shadow: 0 0 0 1.5px var(--hl); }
.row-dot { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-family: var(--f-mono); font-size: .75rem; font-weight: 600; background: var(--hl); color: var(--surface); }
.tag { font-family: var(--f-mono); font-size: .7rem; font-weight: 600; letter-spacing: .04em; padding: 3px 8px; border-radius: 6px; }
.tag-lvk { background: color-mix(in srgb, var(--c1) 15%, transparent); color: var(--c1); }
.tag-lck { background: color-mix(in srgb, var(--c3) 15%, transparent); color: var(--c3); }
.tag-res { background: color-mix(in srgb, var(--sup) 16%, transparent); color: var(--sup); }
.eq-lines { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; align-items: baseline; }
.eq-k { font-family: var(--f-mono); font-size: .66rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.eq-v { font-size: .86rem; color: var(--ink); overflow-wrap: anywhere; line-height: 1.5; }
.eq-final { font-weight: 600; color: var(--ink); }
@media (max-width: 420px) { .eq-lines { grid-template-columns: 1fr; gap: 0; } .eq-k { margin-top: 5px; } }

/* Matrices */
.matrix-eq { display: inline-flex; align-items: center; gap: 10px; min-width: max-content; padding-top: 4px; }
.mat-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.mat-cap { font-family: var(--f-mono); font-size: .72rem; color: var(--ink); font-weight: 600; }
.op { font-family: var(--f-mono); font-size: 1.3rem; color: var(--muted); padding-top: 18px; }
.mat { position: relative; display: grid; gap: 2px 4px; padding: 6px 12px; font-family: var(--f-mono); font-size: .86rem; font-variant-numeric: tabular-nums; }
.mat::before, .mat::after { content: ''; position: absolute; top: 0; bottom: 0; width: 8px; border: 2px solid var(--ink); }
.mat::before { left: 0; border-right: none; border-radius: 4px 0 0 4px; }
.mat::after { right: 0; border-left: none; border-radius: 0 4px 4px 0; }
.cell { padding: 5px 8px; text-align: right; border-radius: 7px; color: var(--ink); white-space: nowrap; transition: background .15s; }
.cell.clickable { cursor: pointer; }
.cell.clickable:hover { background: var(--surface2); }
.cell.on { background: color-mix(in srgb, var(--hl, var(--accent)) 18%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--hl, var(--accent)) 50%, transparent) inset; }
.expand { border-left: 3px solid var(--hl); padding: 8px 12px; background: var(--surface2); border-radius: 0 10px 10px 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface2); font-size: .82rem; color: var(--ink); }
.pill-ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 9%, var(--surface)); font-weight: 600; }
.pill-bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); font-weight: 600; }
.ucard { text-align: left; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); border-top: 3px solid var(--hl, var(--accent)); background: var(--surface); min-height: 44px; }
.ucard:not(.static):hover, .ucard.on { background: color-mix(in srgb, var(--hl) 8%, var(--surface)); }
.ucard.on { box-shadow: 0 0 0 1.5px var(--hl); }
.verify { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.prose-w { max-width: 66ch; }

/* Matriz editable */
.matrix-eq.wrapme { flex-wrap: wrap; min-width: 0; row-gap: 14px; }
.mx-input { width: 3.4rem !important; padding: 0 4px !important; font-size: 0.85rem !important; }
@media (min-width: 640px) { .mx-input { width: 4.6rem !important; padding: 0 8px !important; font-size: 0.95rem !important; } }

/* Tabla */
.tbl { width: 100%; border-collapse: collapse; font-size: .86rem; }
.tbl th { text-align: right; font-family: var(--f-mono); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--line); font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.tbl td.neg { color: var(--sup); }
.tbl tr:last-child td { border-bottom: none; }


/* ===== Curso: barra superior, HUD, pestañas ===== */
.topbar { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { font-size: 1rem; flex: 1 1 auto; color: var(--ink); text-decoration: none; white-space: nowrap; }
.hud-pill { display: inline-flex; align-items: center; gap: 4px; padding: 5px 8px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); font-family: var(--f-mono); font-size: .85rem; font-weight: 600; color: var(--ink); white-space: nowrap; }
.ico { width: 1.05em; height: 1.05em; display: inline-block; vertical-align: -0.15em; flex: none; }
.text-flame { color: var(--sup); } .text-heart { color: #e0245e; } .text-bolt { color: var(--flow); } .text-ok { color: var(--ok); }
.tabs-row { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs-row::-webkit-scrollbar { display: none; }
.tabs-row button { min-height: 44px; padding: 0 14px; font-weight: 600; font-size: .92rem; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs-row button.on { color: var(--accent); border-bottom-color: var(--accent); }
.tabs-row button:hover { color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: .95rem; transition: transform .1s, filter .15s; }
.btn:hover { filter: brightness(1.08); } .btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn-lg { min-height: 54px; font-size: 1.05rem; padding: 0 22px; }
.btn-ghost { display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: .9rem; }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.iconbtn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; }
.iconbtn:hover { color: var(--ink); }
.bar { height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--c1)); border-radius: 999px; transition: width .4s ease; }
.hud-lives { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-mono); font-weight: 700; color: #e0245e; }
.gate { padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--sup) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--sup) 40%, transparent); font-size: .9rem; }

/* ===== Camino ===== */
.unitcard { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--u); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.unitcard.locked { opacity: .72; }
.unit-head { width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px; text-align: left; }
.unit-num { flex: none; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--u) 16%, var(--surface)); color: var(--u); font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; }
.ring { flex: none; width: 50px; height: 50px; border-radius: 50%; background: conic-gradient(var(--u) calc(var(--p) * 360deg), var(--line) 0); display: grid; place-items: center; }
.ring span { width: 38px; height: 38px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: var(--f-mono); font-size: .7rem; font-weight: 600; color: var(--ink); }
.path { list-style: none; margin: 0; padding: 4px 16px 12px 16px; display: flex; flex-direction: column; gap: 10px; position: relative; }
.path::before { content: ''; position: absolute; left: 38px; top: 10px; bottom: 20px; width: 3px; background: var(--line); border-radius: 3px; }
.node { position: relative; width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 8px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-align: left; transition: border-color .15s, transform .1s; }
.node:disabled { cursor: not-allowed; color: var(--muted); }
.node.ready { border-color: var(--u); box-shadow: 0 0 0 3px color-mix(in srgb, var(--u) 18%, transparent); }
.node.ready:hover { transform: translateX(2px); }
.node.done { background: color-mix(in srgb, var(--u) 6%, var(--surface)); }
.node-dot { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface2); border: 2px solid var(--line); color: var(--muted); z-index: 1; }
.node.ready .node-dot { background: var(--u); border-color: var(--u); color: #fff; animation: pulse 1.8s infinite; }
.node.done .node-dot { background: var(--u); border-color: var(--u); color: #fff; }
.node.boss .node-dot { border-radius: 12px; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--u) 45%, transparent); } 60% { box-shadow: 0 0 0 9px transparent; } }
.stars { display: inline-flex; gap: 1px; color: var(--line); }
.stars .ico.on { color: var(--flow); }
.dyn { padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--c3) 8%, var(--surface)); border-left: 3px solid var(--c3); }

/* ===== Sesión y ejercicios ===== */
.session { max-width: 760px; margin: 0 auto; }
.ex-prompt { font-size: 1.05rem; line-height: 1.5; color: var(--ink); margin-bottom: 12px; text-wrap: pretty; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 10px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); text-align: left; font-size: .95rem; color: var(--ink); transition: border-color .15s, background .15s; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 5%, var(--surface)); }
.opt:disabled { opacity: .55; cursor: not-allowed; }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 7%, var(--surface)); text-decoration: line-through; }
.opt.sel { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
.opt.mono { font-family: var(--f-mono); font-size: .9rem; }
.opt-k { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--surface2); border: 1px solid var(--line); font-family: var(--f-mono); font-size: .75rem; font-weight: 600; color: var(--muted); }
.order-slot { min-height: 54px; padding: 8px; border-radius: 14px; border: 1.5px dashed var(--line); background: var(--surface2); display: flex; flex-wrap: wrap; gap: 6px; }
.chipstep { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 10px; background: var(--surface); border: 1.5px solid var(--accent); font-size: .85rem; text-align: left; }
.chipstep b { font-family: var(--f-mono); color: var(--accent); }
.feedback { margin-top: 14px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid; animation: tipin .18s ease-out; }
.feedback.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 9%, var(--surface)); }
.feedback.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, var(--surface)); }
.feedback.warn { border-color: var(--sup); background: color-mix(in srgb, var(--sup) 9%, var(--surface)); }
.lab { padding: 12px; border-radius: 14px; background: var(--surface2); border: 1px solid var(--line); }
.lab-ctl { display: block; padding: 6px 8px 0; }
.example { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.sel { display: block; width: 100%; margin-top: 4px; min-height: 42px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: .9rem; }
.ta { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); padding: 10px 12px; font-family: var(--f-mono); font-size: .8rem; }
.badge { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); opacity: .55; }
.badge .ico { width: 1.6em; height: 1.6em; color: var(--muted); }
.badge.on { opacity: 1; border-color: color-mix(in srgb, var(--flow) 55%, transparent); background: color-mix(in srgb, var(--flow) 8%, var(--surface)); }
.badge.on .ico { color: var(--flow); }
.max-w-prose { max-width: 66ch; }

@media (prefers-reduced-motion: reduce) {
  .node.ready .node-dot { animation: none; } .feedback { animation: none; }
  .flow { animation: none; stroke-dasharray: 0.1 12; }
  .mesh-arrow.strong path { animation: none; }
  .legend-flow i, .tip-card { animation: none; }
  * { scroll-behavior: auto !important; }
}
</style>

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
(() => {
  // glossary.js
  var GLOSSARY = {
    fuentei: { t: "Fuente de corriente", d: "Elemento que impone una corriente fija sin importar la carga; su voltaje lo decide el circuito. Apagada equivale a un circuito abierto.", i: 'Es la dual de la pila: la pila fija la "presi\xF3n", la fuente de corriente fija el "caudal".', s: "En la forma de estado, las fuentes son la entrada u(t); las de corriente entran directo en las ecuaciones de LCK." },
    conversion: { t: "Conversi\xF3n de fuentes", d: "Una fuente E con R en serie equivale, desde sus terminales, a una fuente I = E/R con la misma R en paralelo, y viceversa.", i: "Desde afuera nadie distingue una de otra: misma curva voltaje-corriente en las terminales." },
    matriz: { t: "Matriz del sistema A", d: "Coeficientes de las ecuaciones de Kirchhoff agrupadas por inc\xF3gnita. En mallas es de resistencias; en nodos, de conductancias. Diagonal: suma propia; fuera: menos lo compartido.", i: "Cada fila es una ley (LVK o LCK) y cada columna una inc\xF3gnita. Leerla es leer el circuito.", s: "Es la misma A que, con capacitores e inductores, se vuelve la matriz de estado del sistema din\xE1mico." },
    puente: { t: "Puente de Wheatstone", d: "Cuatro resistores en rombo con un quinto en el centro. Equilibrado cuando R\u2081/R\u2083 = R\u2082/R\u2084: entonces el central no conduce.", i: "Dos divisores de voltaje comparados: si dan lo mismo, no hay diferencia que empuje corriente por el centro." },
    deltay: { t: "Conversi\xF3n \u0394-Y", d: "Tres resistores en tri\xE1ngulo (\u0394) equivalen a tres en estrella (Y): R_Y = producto de los \u0394 adyacentes entre la suma de los tres. Con valores iguales, R_Y = R_\u0394/3.", i: "Sirve para convertir en serie-paralelo redes que no lo son, como un puente desbalanceado." },
    superposicion: { t: "Superposici\xF3n", d: "En un circuito lineal, la respuesta a varias fuentes es la suma de las respuestas a cada fuente actuando sola (las dem\xE1s apagadas). No aplica a potencias.", i: "Apagar una fuente de voltaje es un corto; una de corriente, un abierto.", s: "Es la definici\xF3n de linealidad: la respuesta a u\u2081 + u\u2082 es la suma de respuestas. Base de toda la teor\xEDa de sistemas lineales." },
    maxpot: { t: "M\xE1xima transferencia de potencia", d: "La carga recibe la m\xE1xima potencia cuando R_L = R_th; vale V_th\xB2/(4R_th) y la eficiencia es 50 %.", i: "Carga muy peque\xF1a: mucho corriente pero poco voltaje. Muy grande: al rev\xE9s. El punto medio es R_L = R_th." },
    millman: { t: "Teorema de Millman", d: "Para ramas en paralelo con fuente y resistencia: V = (\u03A3E/R)/(\u03A31/R) y R_eq = 1/(\u03A31/R).", i: "Es convertir cada rama a fuente de corriente, sumar y regresar a voltaje, en un solo paso." },
    unidades: { t: "Unidades del SI", d: "Sistema Internacional: ampere (A), volt (V), ohm (\u03A9), watt (W), joule (J), coulomb (C) y siemens (S) para las magnitudes el\xE9ctricas.", i: "Las unidades son la gram\xE1tica de las f\xF3rmulas: si el resultado no sale en la unidad esperada, hay un error antes.", s: "Un modelo de estado mezcla unidades distintas en el mismo vector x; llevar la cuenta evita ganancias absurdas." },
    notacion: { t: "Notaci\xF3n cient\xEDfica", d: "Un n\xFAmero escrito como mantisa por potencia de diez: 4.7 \xD7 10\xB3. Al multiplicar, los exponentes se suman; al dividir, se restan.", i: "Es la forma de mover el punto decimal sin perderlo de vista. Los prefijos (k, m, \xB5) son potencias de diez con nombre." },
    carga: { t: "Carga el\xE9ctrica (q)", d: "Propiedad de la materia que produce fuerzas el\xE9ctricas. Se mide en coulombs (C). Un electr\xF3n lleva \u22121.602 \xD7 10\u207B\xB9\u2079 C; un coulomb son 6.242 \xD7 10\xB9\u2078 electrones.", i: 'La carga es "lo que fluye". Un coulomb es una cantidad enorme de electrones, por eso las corrientes cotidianas de 1 A mueven billones de electrones cada segundo.' },
    corriente: { t: "Corriente (I)", d: "Flujo neto de carga que atraviesa una secci\xF3n por unidad de tiempo: I = Q/t (o dq/dt). Se mide en amperes (1 A = 1 C/s).", i: "Piensa en el caudal de una tuber\xEDa: cu\xE1nta carga pasa cada segundo. El signo depende de la flecha de referencia que elijas; un resultado negativo s\xF3lo significa que fluye al rev\xE9s de tu flecha.", s: "En un inductor la corriente es variable de estado: no puede saltar de golpe." },
    convencional: { t: "Sentido convencional", d: "Por convenci\xF3n, la corriente se dibuja saliendo del terminal + de la fuente y entrando al \u2212, como si fluyeran cargas positivas. Los electrones se mueven al rev\xE9s.", i: "Es un acuerdo hist\xF3rico anterior al descubrimiento del electr\xF3n. Todas las f\xF3rmulas funcionan igual; s\xF3lo hay que ser consistente." },
    voltaje: { t: "Voltaje (V)", d: "Diferencia de potencial el\xE9ctrico entre dos puntos: energ\xEDa por unidad de carga, V = W/Q, en volts (1 V = 1 J/C).", i: 'Es la diferencia de presi\xF3n o de altura que empuja a la carga. Siempre se mide entre dos puntos; "el voltaje de un nodo" significa respecto a tierra.', s: "En un capacitor el voltaje es variable de estado: guarda energ\xEDa \xBDCV\xB2." },
    fuente: { t: "Fuente de voltaje", d: "Elemento que mantiene una diferencia de potencial fija entre sus terminales sin importar la corriente que entregue (fuente ideal). Una real tiene resistencia interna.", i: 'Una bomba que mantiene la presi\xF3n. La fuente no "empuja corriente": la corriente la decide el circuito que le conectes.' },
    resistencia: { t: "Resistencia (R)", d: "Oposici\xF3n al paso de corriente. En un resistor lineal V = R\xB7I (Ley de Ohm), en ohms (\u03A9). Disipa potencia P = I\xB2R como calor.", i: "Una tuber\xEDa angosta o la fricci\xF3n. Su inverso G = 1/R es la conductancia: qu\xE9 tan f\xE1cil pasa la corriente.", s: "Es el amortiguador del sistema: el t\xE9rmino que disipa energ\xEDa, como b\xB7\u1E8B en un masa-resorte." },
    resistividad: { t: "Resistividad (\u03C1)", d: "Propiedad del material: R = \u03C1\xB7L/A. Mayor longitud, m\xE1s resistencia; mayor \xE1rea, menos. El cobre tiene \u03C1 \u2248 1.72 \xD7 10\u207B\u2078 \u03A9\xB7m.", i: 'Un tubo largo y delgado ofrece m\xE1s fricci\xF3n que uno corto y ancho. El material es "qu\xE9 tan rugoso" es el tubo.' },
    conductancia: { t: "Conductancia (G = 1/R)", d: "Inverso de la resistencia, en siemens (S). En an\xE1lisis nodal la matriz A es una matriz de conductancias.", i: "Mide la facilidad de paso. Resistencias en paralelo suman conductancias." },
    ohm: { t: "Ley de Ohm", d: "En un resistor lineal, V = I\xB7R. Equivalentemente I = V/R y R = V/I. El voltaje medido es el que cae entre los extremos de ese mismo resistor.", i: "A m\xE1s empuje (V), m\xE1s flujo (I); a m\xE1s oposici\xF3n (R), menos flujo. Es una recta: si duplicas V se duplica I.", s: "Es la relaci\xF3n constitutiva del elemento disipativo, igual que F = b\xB7v en un amortiguador." },
    potencia: { t: "Potencia (P)", d: "Rapidez con que se transforma la energ\xEDa: P = W/t = V\xB7I, en watts (1 W = 1 J/s). En un resistor, P = I\xB2R = V\xB2/R.", i: "El voltaje es energ\xEDa por carga y la corriente es carga por segundo; su producto es energ\xEDa por segundo." },
    energia: { t: "Energ\xEDa (W)", d: "Potencia acumulada en el tiempo: W = P\xB7t, en joules. La compa\xF1\xEDa el\xE9ctrica cobra en kilowatt-hora: 1 kWh = 3.6 \xD7 10\u2076 J.", i: "Potencia es qu\xE9 tan r\xE1pido gastas; energ\xEDa es cu\xE1nto gastaste en total." },
    eficiencia: { t: "Eficiencia (\u03B7)", d: "Cociente entre la potencia \xFAtil de salida y la de entrada: \u03B7 = P_salida/P_entrada, siempre menor que 1 (o 100 %).", i: "Lo que se pierde se vuelve calor. En cascada, las eficiencias se multiplican." },
    serie: { t: "Conexi\xF3n en serie", d: "Elementos conectados uno tras otro, de modo que por todos circula la misma corriente. La resistencia total es la suma: R_T = R_1 + R_2 + \u2026.", i: "Un solo camino: lo que pasa por uno tiene que pasar por el siguiente. M\xE1s resistores en serie = m\xE1s oposici\xF3n." },
    paralelo: { t: "Conexi\xF3n en paralelo", d: "Elementos conectados entre los mismos dos nodos, de modo que todos tienen el mismo voltaje. Las conductancias se suman: 1/R_T = 1/R_1 + 1/R_2 + \u2026.", i: "Varios caminos entre los mismos puntos: la corriente se reparte y la resistencia total siempre es menor que la m\xE1s peque\xF1a." },
    divisorv: { t: "Regla del divisor de voltaje", d: "En una serie, el voltaje de cada resistor es proporcional a su resistencia: V_x = E \xB7 R_x / R_T.", i: "La fuente reparte su voltaje en proporci\xF3n a qui\xE9n se opone m\xE1s. El resistor grande se lleva la mayor tajada." },
    divisori: { t: "Regla del divisor de corriente", d: "En un paralelo, la corriente de una rama es inversamente proporcional a su resistencia: I_x = I_T \xB7 R_T / R_x. Para dos ramas, I_1 = I_T \xB7 R_2/(R_1 + R_2).", i: "La corriente prefiere el camino f\xE1cil: la rama de menor resistencia se lleva m\xE1s corriente." },
    nodo: { t: "Nodo", d: "Punto donde se unen dos o m\xE1s elementos. Todo el cable que lo forma est\xE1 al mismo potencial.", i: "Un cruce de tuber\xEDas: lo que entra tiene que salir, porque la carga no se acumula en un cable.", s: "Los voltajes de nodo son coordenadas que cumplen LVK autom\xE1ticamente; s\xF3lo falta imponer LCK." },
    malla: { t: "Malla", d: 'Lazo cerrado de un circuito plano que no encierra otros lazos: cada "ventana" del dibujo.', i: "Asignas una corriente que gira por cada ventana. La corriente real de una rama compartida es la resta de las dos corrientes que la recorren.", s: "Elegir corrientes de malla es elegir una base del espacio de corrientes que ya cumple LCK autom\xE1ticamente." },
    lvk: { t: "Ley de Voltajes de Kirchhoff (LVK)", d: "La suma algebraica de voltajes en cualquier lazo cerrado es cero: las subidas de la fuente igualan las ca\xEDdas en los resistores.", i: 'Si das una vuelta completa y regresas al mismo punto, regresas a la misma "altura": la energ\xEDa por unidad de carga se conserva.' },
    lck: { t: "Ley de Corrientes de Kirchhoff (LCK)", d: "La suma de corrientes que entran a un nodo (o a cualquier superficie cerrada) es igual a la suma de las que salen.", i: 'Conservaci\xF3n de la carga: lo que entra, sale. Por eso tambi\xE9n vale para la "burbuja" de un supernodo.' },
    abierto: { t: "Circuito abierto", d: "Interrupci\xF3n del camino: resistencia infinita, corriente cero. Entre sus extremos puede haber cualquier voltaje.", i: 'Un cable cortado. No pasa nada de corriente, pero el voltaje "se asoma" en la abertura.' },
    corto: { t: "Cortocircuito", d: "Camino de resistencia cero entre dos puntos: el voltaje entre ellos es cero y la corriente la decide el resto del circuito.", i: "Un cable que puentea un elemento: toda la corriente prefiere ese camino y el elemento puenteado queda sin voltaje." },
    tierra: { t: "Tierra (referencia)", d: "Nodo al que asignamos 0 V. Los voltajes con un solo sub\xEDndice (V_a) se miden respecto a tierra; V_ab = V_a \u2212 V_b.", i: "Como elegir el nivel del mar para medir alturas: cualquier elecci\xF3n sirve, s\xF3lo cambia el punto de partida." },
    referencia: { t: "Nodo de referencia (tierra)", d: "Nodo al que asignamos 0 V. Todos los voltajes de nodo se miden contra \xE9l.", i: "Como elegir el nivel del mar para medir alturas: cualquier elecci\xF3n sirve, s\xF3lo cambia el punto de partida." },
    escalera: { t: "Red escalera", d: "Red serie-paralelo repetitiva con forma de escalera. Se resuelve reduciendo desde el extremo lejano hacia la fuente y luego regresando con divisores.", i: "Como doblar y desdoblar un mapa: primero lo compactas hasta un solo resistor, luego vas abriendo etapa por etapa." },
    interna: { t: "Resistencia interna", d: "Resistencia en serie que modela las p\xE9rdidas de una fuente real: V_terminales = E \u2212 I\xB7R_int. A mayor corriente, menor voltaje de salida.", i: 'Por eso una pila "cansada" marca 1.5 V sin carga pero cae al conectarla.' },
    prefijo: { t: "Prefijos del SI", d: "Multiplicadores de potencias de 10: k = 10\xB3, M = 10\u2076, G = 10\u2079, m = 10\u207B\xB3, \xB5 = 10\u207B\u2076, n = 10\u207B\u2079, p = 10\u207B\xB9\xB2.", i: "Mover el prefijo equivale a mover el punto decimal de tres en tres. Un n\xFAmero que crece necesita un prefijo mayor." },
    cifras: { t: "Cifras significativas", d: "D\xEDgitos que aportan informaci\xF3n real sobre la precisi\xF3n de una medida. El resultado de un c\xE1lculo no debe tener m\xE1s cifras significativas que el dato menos preciso.", i: "Si mides con una regla de mil\xEDmetros, no puedes reportar micras. Redondear al final evita falsas precisiones." },
    colores: { t: "C\xF3digo de colores", d: "Bandas que indican el valor de un resistor: negro 0, caf\xE9 1, rojo 2, naranja 3, amarillo 4, verde 5, azul 6, violeta 7, gris 8, blanco 9. La tercera banda es el multiplicador; la cuarta, la tolerancia (dorado 5 %, plateado 10 %).", i: "Las dos primeras bandas forman el n\xFAmero y la tercera dice cu\xE1ntos ceros le pones." },
    supermalla: { t: "Supermalla", d: "Lazo formado al unir dos mallas que comparten una fuente de corriente.", i: 'No conoces el voltaje de la fuente de corriente, as\xED que "borras" su rama y aplicas LVK al lazo exterior. La fuente aporta una ecuaci\xF3n extra: la diferencia de corrientes de malla es igual a I_s.', s: "Es una restricci\xF3n lineal que reduce los grados de libertad del sistema." },
    supernodo: { t: "Supernodo", d: "Superficie cerrada que envuelve una fuente de voltaje conectada entre dos nodos que no son tierra, junto con esos dos nodos.", i: "No conoces la corriente por la fuente, as\xED que la encierras en una burbuja y aplicas LCK a la burbuja completa. La fuente aporta la restricci\xF3n v\u208A \u2212 v\u208B = V_s.", s: "Igual que la supermalla: una ecuaci\xF3n algebraica de restricci\xF3n que acompa\xF1a a las de balance." },
    restriccion: { t: "Ecuaci\xF3n de restricci\xF3n", d: "Ecuaci\xF3n que impone una fuente sobre las inc\xF3gnitas sin pasar por la Ley de Ohm: I\u2083 \u2212 I\u2082 = I_s o v\u2082 \u2212 v\u2081 = V_s.", i: "No es una ley de balance, es un dato del circuito. En la matriz aparece como una fila de 1 y \u22121.", s: "An\xE1loga a una restricci\xF3n holon\xF3mica en mec\xE1nica: liga dos coordenadas." },
    thevenin: { t: "Teorema de Th\xE9venin", d: "Toda red lineal vista desde dos terminales equivale a una fuente V_{th} en serie con una resistencia R_{th}.", i: 'A la carga no le importa qu\xE9 hay dentro de la red: s\xF3lo "siente" V_{th} y R_{th}.', s: "Es una reducci\xF3n de orden: todo el sistema se resume en una relaci\xF3n entrada-salida en el puerto a\u2013b." },
    norton: { t: "Teorema de Norton", d: "La misma red equivale a una fuente de corriente I_N en paralelo con R_N = R_{th}.", i: "Es la versi\xF3n dual de Th\xE9venin. Se pasa de uno al otro con V_{th} = I_N\xB7R_N." },
    inversa: { t: "Matriz inversa A\u207B\xB9", d: "La matriz que cumple A\u207B\xB9A = I. Si det(A) \u2260 0, la \xFAnica soluci\xF3n es x = A\u207B\xB9B.", i: "La columna j de A\u207B\xB9 dice c\xF3mo responde cada inc\xF3gnita a una fuente unitaria en la ecuaci\xF3n j: es una matriz de ganancias.", s: "En estado estacionario, A\u207B\xB9B es la respuesta del sistema a la entrada constante B." },
    determinante: { t: "Determinante", d: "N\xFAmero que indica si A es invertible. det(A) = 0 significa ecuaciones dependientes: el circuito no tendr\xEDa soluci\xF3n \xFAnica.", i: "Con resistencias positivas y un circuito bien conectado, det(A) nunca es cero." }

  function modelNodos(P) {
